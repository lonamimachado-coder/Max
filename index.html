  appId: "1:441071897372:web:c1aaf8b738fed8b4a8c8d9"
};
const _fbApp  = firebase.initializeApp(_fbCfg);
const _db     = firebase.firestore();

// ID y nombre de este dispositivo (navegador)
function _myDeviceId() {
  let id = localStorage.getItem('max_device_id');
  if (!id) { id = 'browser_' + Math.random().toString(36).slice(2,10); localStorage.setItem('max_device_id', id); }
  return id;
}
function _myDeviceName() {
  return localStorage.getItem('max_device_name') || navigator.platform || 'Dispositivo';
}

// Registrar este dispositivo en Firestore como "browser" (sin bridge)
async function registerThisDevice() {
  try {
    await _db.collection('max_devices').doc(_myDeviceId()).set({
      name: _myDeviceName(),
      lastSeen: new Date().toISOString(),
      status: 'browser',
      deviceId: _myDeviceId()
    }, { merge: true });
  } catch(e) { console.warn('Firebase reg:', e); }
}
registerThisDevice();
setInterval(registerThisDevice, 25000);

// ── HTML del panel ────────────────────────────────────────────────────────
function remoteHTML() {
  return `
  <div style="display:flex;height:100%;gap:10px">
    <!-- Sidebar: lista de PCs -->
    <div style="width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:8px">
      <div class="stitle" style="font-size:11px;margin-bottom:4px">DISPOSITIVOS ONLINE</div>
      <div id="rm-devices" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px">
        <div style="color:var(--dim);font-size:11px">Buscando...</div>
      </div>
      <div style="border-top:1px solid var(--cb);padding-top:8px">
        <div style="font-size:10px;color:var(--dim);margin-bottom:4px">NOMBRE DE ESTE DISPOSITIVO</div>
        <input id="rm-myname" type="text" placeholder="Mi PC / Celular..." value="${_myDeviceName()}"
          style="width:100%;background:rgba(0,0,0,.3);border:1px solid var(--cb);color:var(--c2);font-size:11px;padding:5px 8px;border-radius:4px;font-family:inherit;box-sizing:border-box">
        <button class="btn s g" style="width:100%;margin-top:6px;font-size:10px" id="rm-save-name">GUARDAR</button>
      </div>
    </div>

    <!-- Panel principal -->
    <div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="font-size:11px;color:var(--dim)">CONTROLANDO: <span id="rm-selected-name" style="color:var(--c)">— ninguno —</span></div>
        <div style="flex:1"></div>
        <button id="rm-screen-btn" class="btn s" style="font-size:10px" disabled>VER PANTALLA</button>
        <div id="rm-screen-dot" style="width:7px;height:7px;border-radius:50%;background:#555"></div>
      </div>

      <!-- Vista de pantalla remota -->
      <div id="rm-screen-wrap" style="background:rgba(0,0,0,.4);border:1px solid var(--cb);border-radius:6px;overflow:hidden;height:380px;display:flex;align-items:center;justify-content:center">
        <img id="rm-screen-img" style="max-width:100%;max-height:100%;object-fit:contain;display:none" />
        <div id="rm-screen-off" style="color:var(--dim);font-size:12px;text-align:center">
          Selecciona un dispositivo y activa "Ver Pantalla"<br>
          <span style="font-size:10px;opacity:.6">(El bridge del dispositivo remoto debe estar corriendo)</span>
        </div>
      </div>

      <!-- Chat de comandos -->
      <div id="rm-chat" style="flex:1;overflow-y:auto;min-height:80px;max-height:180px;display:flex;flex-direction:column;gap:4px;font-size:12px"></div>
      <div style="display:flex;gap:8px">
        <input id="rm-input" type="text" placeholder="Escribe un comando para el dispositivo seleccionado..."
          style="flex:1;background:rgba(0,0,0,.3);border:1px solid var(--cb);color:var(--c2);font-size:12px;padding:8px 10px;border-radius:6px;font-family:inherit" disabled>
        <button id="rm-send" class="btn" style="font-size:11px" disabled>ENVIAR</button>
      </div>
    </div>
  </div>`;
}

// ── Lógica del panel ──────────────────────────────────────────────────────
function bindRemote() {
  let selectedDevice = null;   // { deviceId, name }
  let screenActive   = false;
  let screenInterval = null;
  let cmdListener    = null;   // Firestore real-time listener

  // -- Guardar nombre de este dispositivo
  $('#rm-save-name').onclick = () => {
    const n = $('#rm-myname').value.trim();
    if (!n) return;
    localStorage.setItem('max_device_name', n);
    registerThisDevice();
    toast('Nombre guardado');
  };

  // -- Cargar lista de dispositivos (poll cada 10 s)
  async function loadDevices() {
    try {
      const snap = await _db.collection('max_devices').get();
      const now = Date.now();
      const list = [];
      snap.forEach(doc => {
        const d = doc.data();
        const last = new Date(d.lastSeen || 0).getTime();
        const online = (now - last) < 60000; // online si visto hace < 60 s
        if (d.deviceId !== _myDeviceId()) {
          list.push({ ...d, online });
        }
      });
      const el = $('#rm-devices');
      if (!el) return;
      if (list.length === 0) {
        el.innerHTML = '<div style="color:var(--dim);font-size:11px">Sin dispositivos online.<br>Abre el bridge en otra PC.</div>';
        return;
      }
      el.innerHTML = list.map(d => `
        <div class="rm-dev ${d.online?'':'rm-off'}" data-id="${d.deviceId}" data-name="${d.name}"
          style="padding:8px 10px;border-radius:6px;border:1px solid ${d.online?'var(--cb)':'rgba(255,255,255,.08)'};
                 cursor:${d.online?'pointer':'default'};display:flex;align-items:center;gap:8px;
                 background:${selectedDevice?.deviceId===d.deviceId?'var(--cd)':'rgba(0,0,0,.2)'};transition:.2s">
          <div style="width:7px;height:7px;border-radius:50%;background:${d.online?'var(--c)':'#555'};flex-shrink:0"></div>
          <div>
            <div style="font-size:11px;color:${d.online?'var(--c2)':'var(--dim)'}">${d.name}</div>
            <div style="font-size:9px;color:var(--dim)">${d.status==='online'?'Bridge activo':'Solo navegador'}</div>
          </div>
        </div>`).join('');
      el.querySelectorAll('.rm-dev:not(.rm-off)').forEach(el => {
        el.onclick = () => selectDevice({ deviceId: el.dataset.id, name: el.dataset.name });
      });
    } catch(e) { console.warn('loadDevices:', e); }
  }
  loadDevices();
  const devTimer = setInterval(loadDevices, 10000);

  // -- Seleccionar dispositivo
  function selectDevice(dev) {
    selectedDevice = dev;
    $('#rm-selected-name').textContent = dev.name;
    $('#rm-input').disabled = false;
    $('#rm-send').disabled = false;
    $('#rm-screen-btn').disabled = false;
    addRmMsg(`Conectado a ${dev.name}`, 'sys');
    loadDevices(); // actualizar highlight
    // Escuchar resultados en tiempo real
    if (cmdListener) cmdListener();
    cmdListener = _db.collection('max_commands')
      .where('targetDevice', '==', dev.deviceId)
      .orderBy('createdAt', 'desc').limit(1)
      .onSnapshot(snap => {
        snap.docChanges().forEach(ch => {
          const d = ch.doc.data();
          if ((d.status === 'done' || d.status === 'error') && d.result) {
            addRmMsg(d.result, 'max');
          }
        });
      }, () => {});
  }

  // -- Chat
  function addRmMsg(text, who) {
    const c = $('#rm-chat');
    if (!c) return;
    const colors = { you:'var(--c)', max:'var(--c2)', sys:'var(--dim)' };
    const labels = { you:'TÚ', max:'MAX', sys:'SYS' };
    const div = document.createElement('div');
    div.style.cssText = `padding:4px 8px;border-radius:4px;background:rgba(0,0,0,.25);border-left:2px solid ${colors[who]}`;
    div.innerHTML = `<span style="font-size:9px;color:${colors[who]};letter-spacing:1px">${labels[who]}</span><br>${text}`;
    c.appendChild(div);
    c.scrollTop = c.scrollHeight;
  }

  // -- Enviar comando
  async function sendRemoteCmd() {
    if (!selectedDevice) return;
    const msg = $('#rm-input').value.trim();
    if (!msg) return;
    $('#rm-input').value = '';
    addRmMsg(msg, 'you');
    try {
      await _db.collection('max_commands').add({
        targetDevice: selectedDevice.deviceId,
        fromDevice: _myDeviceId(),
        message: msg,
        status: 'pending',
        createdAt: new Date().toISOString()
      });
      addRmMsg('Enviado — esperando respuesta...', 'sys');
    } catch(e) {
      addRmMsg('Error al enviar: ' + e.message, 'sys');
    }
  }
  $('#rm-send').onclick = sendRemoteCmd;
  $('#rm-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendRemoteCmd(); });

  // -- Ver pantalla remota
  $('#rm-screen-btn').onclick = async () => {
    if (!selectedDevice) return;
    screenActive = !screenActive;
    $('#rm-screen-btn').textContent = screenActive ? 'DETENER PANTALLA' : 'VER PANTALLA';
    $('#rm-screen-dot').style.background = screenActive ? 'var(--c)' : '#555';

    if (screenActive) {
      // Registrar como watcher en Firestore
      await _db.collection('max_watchers').doc(selectedDevice.deviceId).set({
        count: firebase.firestore.FieldValue.increment(1)
      }, { merge: true });
      $('#rm-screen-off').style.display = 'none';
      // Polling de la imagen cada 3 s (base64 directo desde Firestore)
      screenInterval = setInterval(async () => {
        try {
          const doc = await _db.collection('max_screens').doc(selectedDevice.deviceId).get();
          if (doc.exists) {
            const b64 = doc.data().b64;
            if (b64) {
              const img = $('#rm-screen-img');
              img.src = 'data:image/jpeg;base64,' + b64;
              img.style.display = 'block';
            }
          }
        } catch(e) {}
      }, 3000);
    } else {
      // Quitar watcher
      try {
        await _db.collection('max_watchers').doc(selectedDevice.deviceId).set({
          count: firebase.firestore.FieldValue.increment(-1)
        }, { merge: true });
      } catch(e) {}
      clearInterval(screenInterval);
      $('#rm-screen-img').style.display = 'none';
      $('#rm-screen-off').style.display = 'block';
    }
  };

  // Cleanup al cerrar la ventana
  return () => {
    clearInterval(devTimer);
    clearInterval(screenInterval);
    if (cmdListener) cmdListener();
    if (screenActive && selectedDevice) {
      _db.collection('max_watchers').doc(selectedDevice.deviceId).set({
        count: firebase.firestore.FieldValue.increment(-1)
      }, { merge: true }).catch(() => {});
    }
  };
}
</script>
</body>
</html>
